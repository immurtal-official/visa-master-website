<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--blue-900);display:grid;place-items:center}
.mark{display:flex;flex-direction:column;align-items:center;gap:22px;color:#fff}
.cn{font-size:152px;font-weight:600;letter-spacing:.02em;line-height:1}
.en{font-size:44px;font-weight:500;letter-spacing:.18em;color:var(--teal-300)}
.strip{width:25%;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><div class="mark"><span class="cn">签证大师</span><span class="en">VISA MASTER</span></div></div>
<div class="strip"><div style="background:#79c9c1"></div><div style="background:#1d9a8e"></div><div style="background:#1f6fb2"></div><div style="background:#124876"></div></div>
</body></html>
