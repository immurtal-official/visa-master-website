<!-- @dsCard group="Brand" viewport="700x190" name="Focus & states" subtitle="Full keyboard traversal of the intake is a requirement, not a nicety" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Focus & states</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--white)}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:60px}.sw i{display:block;height:44px;border-radius:var(--radius-sm);border:1px solid rgba(11,37,69,.08)}.sw b{display:block;font-size:11px;font-weight:500;color:var(--text-body);margin-top:5px}.sw s{display:block;font-size:10px;color:var(--text-faint);text-decoration:none;font-family:var(--font-num)}.lbl{font-size:11px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
<div style="text-align:center"><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;background:var(--action-primary);color:#fff;border-radius:var(--radius-control);font-size:16px;outline:3px solid var(--focus-ring);outline-offset:2px">继续</div><div style="font-size:11px;color:var(--text-faint);margin-top:8px">:focus-visible</div></div>
<div style="text-align:center"><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;background:var(--action-primary-hover);color:#fff;border-radius:var(--radius-control);font-size:16px">继续</div><div style="font-size:11px;color:var(--text-faint);margin-top:8px">:hover — one step darker</div></div>
<div style="text-align:center"><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;background:var(--action-primary-active);color:#fff;border-radius:var(--radius-control);font-size:16px">继续</div><div style="font-size:11px;color:var(--text-faint);margin-top:8px">:active — two steps, no shrink</div></div>
<div style="text-align:center"><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;background:var(--surface-disabled);color:var(--text-faint);border:1px solid var(--border-subtle);border-radius:var(--radius-control);font-size:16px">继续</div><div style="font-size:11px;color:var(--text-faint);margin-top:8px">:disabled</div></div></div>
<p style="margin-top:14px;font-size:12px;color:var(--text-muted)">States are colour changes only. Nothing scales, lifts or fades on press — motion on a control reads as instability.</p></body></html>
