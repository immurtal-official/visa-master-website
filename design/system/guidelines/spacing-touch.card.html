<!-- @dsCard group="Spacing" viewport="700x170" name="Touch & control heights" subtitle="44px minimum everywhere, on both platforms" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Touch & control heights</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--white)}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:60px}.sw i{display:block;height:44px;border-radius:var(--radius-sm);border:1px solid rgba(11,37,69,.08)}.sw b{display:block;font-size:11px;font-weight:500;color:var(--text-body);margin-top:5px}.sw s{display:block;font-size:10px;color:var(--text-faint);text-decoration:none;font-family:var(--font-num)}.lbl{font-size:11px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;align-items:flex-end;gap:16px">
<div><div style="width:150px;height:36px;background:var(--action-primary);border-radius:var(--radius-control)"></div><div style="font-size:11px;color:var(--text-body);margin-top:6px">--control-h-sm · 36px</div><div style="font-size:10px;color:var(--text-faint)">sm — desktop-only, inside dense panels</div></div><div><div style="width:150px;height:44px;background:var(--action-primary);border-radius:var(--radius-control)"></div><div style="font-size:11px;color:var(--text-body);margin-top:6px">--control-h · 44px</div><div style="font-size:10px;color:var(--text-faint)">md — the default</div></div><div><div style="width:150px;height:52px;background:var(--action-primary);border-radius:var(--radius-control)"></div><div style="font-size:11px;color:var(--text-body);margin-top:6px">--control-h-lg · 52px</div><div style="font-size:10px;color:var(--text-faint)">lg — the sticky bar primary</div></div></div>
<p style="margin-top:14px;font-size:12px;color:var(--text-muted)">Inputs never render below 16px — iOS Safari zooms the page otherwise. --touch-min is 44px and applies to icon buttons and list rows too.</p></body></html>
