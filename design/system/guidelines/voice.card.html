<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Voice</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--white)}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:60px}.sw i{display:block;height:44px;border-radius:var(--radius-sm);border:1px solid rgba(11,37,69,.08)}.sw b{display:block;font-size:11px;font-weight:500;color:var(--text-body);margin-top:5px}.sw s{display:block;font-size:10px;color:var(--text-faint);text-decoration:none;font-family:var(--font-num)}.lbl{font-size:11px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:13px;line-height:1.85">

<p style="color:var(--text-body)">护照号码需要 9 位，请检查后重新填写。</p>
<p style="color:var(--text-body);margin-top:8px">两处在职起始日期不一致。请以社保记录为准，或让公司出具更正说明。</p>
<p style="color:var(--text-body);margin-top:8px">已保存。你可以随时关闭页面，之后继续填写。</p></div>
<div><div class="lbl" style="color:var(--red-500)">不要这样</div>
<p style="color:var(--text-faint)">输入无效！请重新输入。</p>
<p style="color:var(--text-faint);margin-top:8px">检测到数据冲突，请核查相关字段。</p>
<p style="color:var(--text-faint);margin-top:8px">保存成功 ✅ 快去下一步吧～</p></div></div></body></html>
