<!-- @dsCard group="Colors" viewport="700x190" name="Status" subtitle="Green success, amber warning, de-escalated brick for error" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--white)}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:60px}.sw i{display:block;height:44px;border-radius:var(--radius-sm);border:1px solid rgba(11,37,69,.08)}.sw b{display:block;font-size:11px;font-weight:500;color:var(--text-body);margin-top:5px}.sw s{display:block;font-size:10px;color:var(--text-faint);text-decoration:none;font-family:var(--font-num)}.lbl{font-size:11px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div class="lbl">成功 success</div><div style="background:var(--status-success-bg);border:1px solid var(--status-success-border);border-radius:var(--radius-card);padding:12px"><span style="color:var(--status-success-fg);font-size:14px;font-weight:500">已生成</span></div><s style="display:block;font-size:10px;color:var(--text-faint);margin-top:6px;font-family:var(--font-num)">status-success-bg</s></div><div><div class="lbl">提醒 warning</div><div style="background:var(--status-warning-bg);border:1px solid var(--status-warning-border);border-radius:var(--radius-card);padding:12px"><span style="color:var(--status-warning-fg);font-size:14px;font-weight:500">待你补充</span></div><s style="display:block;font-size:10px;color:var(--text-faint);margin-top:6px;font-family:var(--font-num)">status-warning-bg</s></div><div><div class="lbl">需要确认 error</div><div style="background:var(--status-error-bg);border:1px solid var(--status-error-border);border-radius:var(--radius-card);padding:12px"><span style="color:var(--status-error-fg);font-size:14px;font-weight:500">日期不一致</span></div><s style="display:block;font-size:10px;color:var(--text-faint);margin-top:6px;font-family:var(--font-num)">status-error-bg</s></div><div><div class="lbl">信息 info</div><div style="background:var(--status-info-bg);border:1px solid var(--status-info-border);border-radius:var(--radius-card);padding:12px"><span style="color:var(--status-info-fg);font-size:14px;font-weight:500">人工复核中</span></div><s style="display:block;font-size:10px;color:var(--text-faint);margin-top:6px;font-family:var(--font-num)">status-info-bg</s></div></div>
<p style="margin-top:14px;font-size:12px;color:var(--text-muted)">Error is #b3453e, not signal red. A missing document is a task, not a catastrophe — the copy carries the urgency, the colour does not.</p></body></html>
