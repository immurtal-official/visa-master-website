<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--white)}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:60px}.sw i{display:block;height:44px;border-radius:var(--radius-sm);border:1px solid rgba(11,37,69,.08)}.sw b{display:block;font-size:11px;font-weight:500;color:var(--text-body);margin-top:5px}.sw s{display:block;font-size:10px;color:var(--text-faint);text-decoration:none;font-family:var(--font-num)}.lbl{font-size:11px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;gap:20px;background:var(--surface-page);padding:16px;border-radius:8px"><div style="text-align:center"><div style="width:120px;height:64px;background:var(--white);border-radius:var(--radius-card);box-shadow:var(--shadow-1)"></div><div style="font-size:11px;color:var(--text-body);margin-top:8px">shadow-1</div><div style="font-size:10px;color:var(--text-faint)">resting card</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--white);border-radius:var(--radius-card);box-shadow:var(--shadow-2)"></div><div style="font-size:11px;color:var(--text-body);margin-top:8px">shadow-2</div><div style="font-size:10px;color:var(--text-faint)">floating panel</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--white);border-radius:var(--radius-card);box-shadow:var(--shadow-3)"></div><div style="font-size:11px;color:var(--text-body);margin-top:8px">shadow-3</div><div style="font-size:10px;color:var(--text-faint)">desktop dialog</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--white);border-radius:var(--radius-card);box-shadow:var(--shadow-sheet)"></div><div style="font-size:11px;color:var(--text-body);margin-top:8px">shadow-sheet</div><div style="font-size:10px;color:var(--text-faint)">bottom sheet</div></div></div></body></html>
