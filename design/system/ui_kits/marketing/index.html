<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>签证大师 · 首页</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}.switch{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;gap:2px;padding:4px;background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);box-shadow:var(--shadow-2)}.switch button{min-height:34px;padding:0 14px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer}.switch button[data-on]{background:var(--action-primary);color:#fff}.switch .sep{width:1px;background:var(--border-subtle);margin:4px 4px}.phone{width:375px;margin:24px auto;border:1px solid var(--border-default);border-radius:var(--radius-2xl);overflow:hidden;background:var(--white);box-shadow:var(--shadow-3)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="copy.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [m,setM]=React.useState(false);
  const [lang,setLang]=React.useState("zh-CN");
  const view=<Home mobile={m} lang={lang} onLang={setLang} onStart={()=>{window.location.href="../app/index.html?lang="+lang}}/>;
  return (<div>
    {m?<div className="phone">{view}</div>:view}
    <div className="switch">
      <button data-on={!m?"":undefined} onClick={()=>setM(false)}>1280</button>
      <button data-on={m?"":undefined} onClick={()=>setM(true)}>375</button>
      <span className="sep"></span>
      <button data-on={lang==="zh-CN"?"":undefined} onClick={()=>setLang("zh-CN")}>简体中文</button>
      <button data-on={lang==="en"?"":undefined} onClick={()=>setLang("en")}>English</button>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
