<!--
  The sign-in email.

  Both languages, every time: the recipient's locale is not known at this layer
  in V1, and guessing wrong means sending someone a code they cannot read the
  instructions for. Per-locale sending arrives when notifications resolve the
  recipient's stored locale server-side.

  {{ .Token }} is what makes this a code rather than a magic link.
-->
<div style="font-family: -apple-system, 'PingFang SC', 'Segoe UI', sans-serif; line-height: 1.75; color: #1e2831">
  <p style="font-weight: 600; color: #0b2545">签证大师 · Visa Master</p>

  <p>你的登录验证码：<strong style="font-size: 20px; letter-spacing: 0.1em">{{ .Token }}</strong></p>
  <p>验证码 10 分钟内有效，只能使用一次。如果不是你本人操作，忽略这封邮件即可。</p>

  <hr style="border: none; border-top: 1px solid #dde4ec; margin: 24px 0" />

  <p>Your sign-in code: <strong style="font-size: 20px; letter-spacing: 0.1em">{{ .Token }}</strong></p>
  <p>The code is valid for 10 minutes and can be used once.</p>
  <p>If you did not request it, you can ignore this email.</p>
</div>
